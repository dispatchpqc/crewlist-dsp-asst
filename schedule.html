<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun PhuQuoc Airways — Lịch trực</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --gold:#F5A300;--gold-deep:#D98600;--gold-pale:#FFE9BE;
  --red:#D2202B;--red-deep:#A11822;--cream:#FFF9EF;--paper:#fff;
  --ink:#2A1D14;--ink-soft:#6B5B4C;--line:#EFE0C4;--line-soft:#F5EBD6;
  --dm:#6E8F5C;--dm-bg:#EEF3E7;--hdq:#3E8E8A;--hdq-bg:#E7F3F2;
  --asst:#9C5E86;--asst-bg:#F5EAF1;--sgn:#3E6FA8;--sgn-bg:#E8EFF7;
  --pqc:#C4548A;--pqc-bg:#FAECF2;--sun:#F9F3E6;--danger:#C0392B;--ok:#4C8C5A;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(42,29,20,.18);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(42,29,20,.3)}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(243,235,224,.18)}
html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:rgba(243,235,224,.3)}
::selection{background:rgba(245,163,0,.3);color:var(--ink)}
.sun-field{background:radial-gradient(circle at 88% -10%,#FFF3D6 0%,rgba(255,243,214,0) 46%),var(--cream)}
header{padding:24px clamp(14px,4vw,44px) 16px}
.brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand-left{display:flex;align-items:center;gap:12px}
.header-auth{display:flex;align-items:center;gap:8px;flex-shrink:0}
.header-auth .btn-action{font-size:12px;padding:7px 14px}
.header-auth .auth-user{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);padding:6px 12px;border-radius:9px}
.header-auth .view-tag{font-size:11px;color:var(--ink-soft);background:var(--sun);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.brandname .sun{font-weight:900;font-size:18px;color:var(--red)}
.brandname .sun em{font-style:normal;color:var(--gold-deep)}
.brandname .sub{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--ink-soft)}
h1{margin:16px 0 6px;font-size:clamp(22px,3.2vw,32px);font-weight:800}
h1 .accent{color:var(--red)}
.lede{color:var(--ink-soft);font-size:13.5px;max-width:620px;margin:0 0 14px;line-height:1.45}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:720px}
.kpi{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  box-shadow:0 2px 8px rgba(42,29,20,.04);
  position:relative;overflow:hidden;
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--gold),var(--red));opacity:.85;
}
.kpi .num{font-size:22px;font-weight:800;color:var(--red);letter-spacing:-.02em;line-height:1.15}
.kpi .lbl{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.controls{
  position:sticky;top:0;z-index:20;
  background:rgba(255,249,239,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px clamp(14px,4vw,44px);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  box-shadow:0 4px 20px rgba(42,29,20,.04);
}
.search{position:relative;flex:1 1 160px;max-width:240px}
.search input{
  width:100%;border:1.5px solid var(--line);background:var(--paper);
  border-radius:11px;padding:8px 12px 8px 34px;font:inherit;font-size:13px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,163,0,.18)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-soft)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);
  font:inherit;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;
  box-shadow:0 1px 3px rgba(42,29,20,.04);
}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(42,29,20,.12)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}
.spacer{flex:1}
.monthpick{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(145deg,var(--gold-pale) 0%,var(--paper) 55%);
  border:2px solid var(--gold);border-radius:14px;padding:5px 10px;
  box-shadow:0 3px 12px rgba(245,163,0,.2), inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;z-index:30;
}
.monthpick label{font-size:10px;color:var(--gold-deep);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.mp-dd{position:relative;display:inline-block}
.mp-dd-btn{
  display:inline-flex;align-items:center;gap:4px;
  border:none;background:transparent;font:inherit;
  font-size:15px;font-weight:800;color:var(--ink);
  cursor:pointer;padding:4px 6px;border-radius:8px;
  outline:none;min-width:2.6em;justify-content:center;
  transition:background .15s,box-shadow .15s;
}
.mp-dd-btn:hover{background:rgba(245,163,0,.1)}
.mp-dd-btn:focus,.mp-dd.open .mp-dd-btn{
  background:rgba(245,163,0,.14);
  box-shadow:0 0 0 2px rgba(245,163,0,.35);
}
.mp-dd-btn .chev{width:12px;height:12px;flex-shrink:0;opacity:.75;transition:transform .2s}
.mp-dd.open .mp-dd-btn .chev{transform:rotate(180deg)}
.mp-dd-menu{
  display:none;position:absolute;top:calc(100% + 6px);left:50%;
  transform:translateX(-50%);
  min-width:72px;max-height:260px;overflow-y:auto;
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:12px;padding:4px;
  box-shadow:0 12px 36px rgba(42,29,20,.18), 0 2px 8px rgba(42,29,20,.08);
  z-index:100;scrollbar-width:thin;
}
.mp-dd.open .mp-dd-menu{display:block;animation:mpPop .18s ease}
@keyframes mpPop{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mp-dd-menu button{
  display:block;width:100%;border:none;background:transparent;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
  padding:8px 12px;border-radius:8px;cursor:pointer;text-align:center;
  transition:background .12s,color .12s;
}
.mp-dd-menu button:hover{background:var(--gold-pale);color:var(--ink)}
.mp-dd-menu button.active{
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:#3a2400;font-weight:800;
}
.monthpick select.mp-native{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.viewtoggle{display:flex;border:2px solid var(--gold);border-radius:13px;overflow:hidden;box-shadow:0 4px 14px rgba(245,163,0,.22);background:var(--paper)}
.viewtoggle button{border:none;background:var(--paper);font:inherit;font-size:13.5px;font-weight:800;padding:10px 18px;cursor:pointer;color:var(--ink-soft);letter-spacing:.01em;transition:background .2s,color .2s}
.viewtoggle button:not(.active):hover{background:var(--gold-pale);color:var(--ink)}
.viewtoggle button.active{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#3a2400;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.viewtoggle button+button{border-left:1.5px solid rgba(0,0,0,.06)}
.btn-action{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn-action:hover{border-color:var(--gold);background:var(--gold-pale)}
.btn-action.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-action.primary:hover{background:var(--red-deep)}
.btn-action:disabled{opacity:.55;cursor:wait}
main{padding:18px clamp(14px,4vw,44px) 50px}
.banner{
  background:linear-gradient(135deg,#FFF6E4,#FFFBF0);border:1px solid #F3D48A;
  border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;color:#6B5100;line-height:1.5;
  box-shadow:0 2px 8px rgba(243,212,138,.2);
}
.banner.ok{background:linear-gradient(135deg,#EAF7EE,#F5FBF6);border-color:#A8D5B5;color:#1E5C32;box-shadow:0 2px 8px rgba(168,213,181,.2)}
.banner.err{background:linear-gradient(135deg,#FDECEA,#FFF5F4);border-color:#F5C2C0;color:#8A1C1C;box-shadow:0 2px 8px rgba(245,194,192,.2)}
.legend{
  display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:16px;
  padding:11px 14px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;font-size:11.5px;color:var(--ink-soft);
  box-shadow:0 1px 4px rgba(42,29,20,.03);
}
.legend .item{display:flex;align-items:center;gap:5px}
.legend .swatch{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.deptgroup{margin-bottom:22px}
.dhead{display:flex;align-items:center;gap:8px;margin:0 0 9px 2px}
.dhead .swatch{width:10px;height:10px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dhead h2{font-size:14.5px;font-weight:800;margin:0}
.dhead .count{font-size:11.5px;color:var(--ink-soft);background:var(--sun);padding:2px 8px;border-radius:99px;border:1px solid var(--line-soft)}
.tablewrap{
  background:var(--paper);border:1.5px solid var(--line);border-radius:14px;
  overflow:auto;-webkit-overflow-scrolling:touch;
  width:100%;
  box-shadow:0 2px 10px rgba(42,29,20,.04);
}
.roster-grid{
  display:grid;
  width:100%;
  min-width:max-content;
  font-size:11px;
}
.roster-grid .rg-head, .roster-grid .rg-row{
  display:contents;
}
.roster-grid .rg-cell{
  box-sizing:border-box;
  border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:center;
  min-height:42px;
  background:var(--paper);
}
.roster-grid .rg-head .rg-cell{
  position:sticky;top:0;z-index:5;
  font-weight:800;font-size:11px;color:var(--ink);
  border-bottom:1.5px solid var(--line);
  background:var(--paper);
  height:36px;
}
.roster-grid .rg-name{
  position:sticky;left:0;z-index:6;
  width:200px;min-width:200px;max-width:220px;
  justify-content:flex-start;padding:4px 12px;
  box-shadow:2px 0 0 var(--line);
  text-align:left;cursor:pointer;
  flex-direction:column;align-items:flex-start;
  height:auto;min-height:38px;
}
.roster-grid .rg-head .rg-name{z-index:7;cursor:default}
.roster-grid .rg-day{
  min-width:28px;
  font-weight:800;cursor:pointer;user-select:none;
  font-size:10.5px;
  position:relative;
}
.roster-grid .rg-day:hover{box-shadow:inset 0 0 0 1.5px var(--gold-deep);z-index:2}
.roster-grid .rg-day.editing{z-index:10;overflow:visible}
.roster-grid .rg-day select.shift-dd{
  position:absolute;inset:0;width:100%;height:100%;
  margin:0;padding:0 1px;border:none;border-radius:0;
  font:inherit;font-size:10px;font-weight:800;text-align:center;
  background:var(--paper);color:var(--ink);cursor:pointer;
  appearance:auto;-webkit-appearance:menulist;
  z-index:11;box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.roster-grid .rg-day select.shift-dd:focus{outline:2px solid var(--gold);outline-offset:-1px}
html[data-theme="dark"] .roster-grid .rg-day select.shift-dd{
  background:#2a211c;color:#f0e6d8;
}
.roster-grid .rg-sum{width:72px;min-width:72px;font-weight:800;font-size:11px;flex-direction:column}
.roster-grid .rg-hrs{width:64px;min-width:64px;font-weight:800;font-size:12.5px;color:var(--red)}
.roster-grid .rg-note{width:88px;min-width:88px;font-size:10.5px}
.roster-grid .wk-sun{background:#FFF7E8}
.roster-grid .rg-head .wk-sun{background:#FFF1D6;color:var(--gold-deep)}
.roster-grid .wk-hol{background:#F2F8EF}
.roster-grid .rg-head .wk-hol{background:#E9F3E6;color:var(--dm)}
.roster-grid .rg-cell.today{box-shadow:inset 0 0 0 2px var(--red-deep);position:relative;z-index:1}
.roster-grid .rg-head .rg-cell.today{background:var(--red);color:#fff;box-shadow:none}
.roster-grid .rg-name.today{box-shadow:2px 0 0 var(--line),inset 3px 0 0 var(--red-deep)}
.legend .item.today-item .swatch{background:var(--red);color:#fff}
.roster-grid .rg-name:hover{background:var(--sun)}
.empname{
  font-weight:700;font-size:12.5px;line-height:1.25;
  white-space:normal;word-break:break-word;
  max-width:196px;overflow:visible;
}
.empid{font-size:10.5px;color:var(--ink-soft);margin-top:1px}
.cell{/* legacy */}
.cell.wk-sun{background:#FFF7E8}.cell.wk-hol{background:#F2F8EF}
.s-M{background:#EAF3FF;color:#245A9C}.s-E{background:#FFEFE0;color:#B25B12}
.s-HC{background:#FDE7EA;color:var(--red-deep)}.s-C9{background:#F1E7FA;color:#6A3D96}
.s-NL{background:#E7F5E9;color:var(--ok)}.s-P{background:#FFF6D6;color:#8A6D00}
.s-SN,.s-T,.s-B{background:#EEE;color:#555}.s-{background:transparent;color:var(--line)}
td.tot{font-size:11.5px;font-weight:800;padding:0 7px;white-space:nowrap}
td.tot .sub{font-weight:500;color:var(--ink-soft);font-size:9.5px}
td.hours{font-size:12.5px;font-weight:800;color:var(--red);white-space:nowrap;padding:0 9px}
td.note{font-size:10.5px;padding:0 9px;white-space:nowrap}
.warn{color:var(--danger);font-weight:700}.okmark{color:var(--ok)}
.peoplegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.personcard{
  background:var(--paper);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 15px;cursor:pointer;
  box-shadow:0 2px 8px rgba(42,29,20,.04);
}
.personcard:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(42,29,20,.1)}
.personcard .ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.personcard .pname{font-weight:800;font-size:14px;line-height:1.25}
.personcard .pid{font-size:11px;color:var(--ink-soft);margin-top:2px}
.depttag{font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0;align-self:flex-start;line-height:1.2}
.personcard .phrs{margin-top:12px;display:flex;align-items:baseline;gap:5px;padding-top:10px;border-top:1px solid var(--line-soft)}
.personcard .phrs b{font-size:20px;color:var(--red);letter-spacing:-.02em}
.personcard .pmini{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pmini .m{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px}
.dutywrap{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.dutywrap{grid-template-columns:1fr 1fr}}
.dutysec{
  background:var(--paper);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 16px;box-shadow:0 2px 10px rgba(42,29,20,.04);
}
.dutysec h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.dutysec h3 .badge{background:var(--ink);color:#fff;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}
.dutylist{display:flex;flex-direction:column;gap:7px}
.dutyitem{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--sun);border-radius:12px;border:1px solid var(--line-soft);
}
.dutyitem .av{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:11px;color:#fff;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.dutyitem .info{flex:1;min-width:0}
.dutyitem .info .nm{font-weight:700;font-size:13px}
.dutyitem .info .meta{font-size:11px;color:var(--ink-soft);margin-top:1px}
.dutyitem .tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px}
.dutyitem .tag.HC{background:#FDE7EA;color:var(--red-deep)}
.dutyitem .tag.M{background:#EAF3FF;color:#245A9C}
.dutyitem .tag.E{background:#FFEFE0;color:#B25B12}
.dutyitem .tag.C9{background:#F1E7FA;color:#6A3D96}
.dutyitem .tag.OFF{background:#E8E8E8;color:#666}
.dutyempty{text-align:center;color:var(--ink-soft);padding:18px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(42,29,20,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  background:var(--paper);border-radius:18px;width:100%;max-width:420px;max-height:88vh;
  overflow:auto;padding:20px;
  box-shadow:0 24px 60px rgba(42,29,20,.25);
  border:1px solid var(--line-soft);
}
.modal.wide{max-width:720px}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mtop h3{margin:0 0 3px;font-size:16px;font-weight:800}
.mtop .mid{font-size:11.5px;color:var(--ink-soft)}
.closeb{border:none;background:var(--sun);width:30px;height:30px;border-radius:50%;cursor:pointer;flex-shrink:0}
.shift-list{
  display:flex;flex-direction:column;gap:0;margin-top:10px;
  border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);
  max-height:min(360px,55vh);overflow-y:auto;
}
.shift-list button{
  border:none;border-bottom:1px solid var(--line-soft);background:var(--paper);
  border-radius:0;padding:11px 14px;font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;width:100%;
}
.shift-list button:last-child{border-bottom:none}
.shift-list button:hover{background:var(--sun)}
.shift-list button.active{background:var(--gold-pale)}
.shift-list button .code{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;min-width:36px;text-align:center;flex-shrink:0}
.shift-list button .lbl{flex:1}
.shift-list button .check{color:var(--ok);font-weight:800;font-size:14px;width:18px;text-align:center}
.token-box{background:var(--sun);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--ink-soft);line-height:1.45}
.token-box input{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12px}
.token-box .row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.auth-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.auth-bar .user{font-weight:700;color:var(--ink)}
.auth-bar .guest{color:var(--ink-soft)}
.login-form{margin-top:12px}
.login-form label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:8px 0 4px}
.login-form input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;box-sizing:border-box}
.login-form input:focus{outline:none;border-color:var(--gold)}
.login-form .err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
.login-form .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.view-only-hint{font-size:11.5px;color:var(--ink-soft);padding:4px 8px;background:var(--sun);border-radius:8px;border:1px solid var(--line)}

footer{text-align:center;padding:18px;font-size:11px;color:var(--ink-soft)}
.mstats{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}
.mstat{background:var(--sun);border-radius:9px;padding:7px 11px}
.mstat b{display:block;font-size:15px}.mstat span{font-size:9.5px;color:var(--ink-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.calcell{
  aspect-ratio:1/.9;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:1.5px solid transparent;
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.calcell:hover{border-color:var(--gold);transform:scale(1.04);box-shadow:0 3px 10px rgba(42,29,20,.08)}
.calcell.today{border-color:var(--red-deep);box-shadow:0 0 0 2px rgba(210,32,43,.2)}
.calcell.today .d{color:var(--red-deep);opacity:1;font-weight:800}
.calcell .d{font-size:9.5px;font-weight:600;opacity:.65}
.calcell .s{font-size:12px;font-weight:800}
.hint{font-size:10.5px;color:var(--ink-soft);margin-top:8px}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 20px;min-height:280px;
  background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;margin-top:8px;
}
.empty-state .icon{font-size:42px;margin-bottom:12px;opacity:.85}
.empty-state h2{margin:0 0 8px;font-size:18px;font-weight:800;color:var(--ink)}
.empty-state p{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);max-width:360px;line-height:1.5}
.empty-state .btn-action{font-size:14px;padding:11px 22px;border-radius:11px}

/* —— motion & polish —— */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 rgba(210,32,43,.25)}50%{box-shadow:0 0 0 6px rgba(210,32,43,0)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.anim-in{animation:fadeUp .45s ease both}
.anim-in-d1{animation:fadeUp .45s .06s ease both}
.anim-in-d2{animation:fadeUp .45s .12s ease both}
.anim-in-d3{animation:fadeUp .45s .18s ease both}

header .brandrow{animation:fadeIn .5s ease}
header h1{animation:fadeUp .5s .05s ease both}
header .lede{animation:fadeUp .5s .1s ease both}
.kpirow{animation:fadeUp .5s .15s ease both}
.kpi{transition:transform .2s ease,box-shadow .2s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(42,29,20,.07)}

.btn-action{
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-action:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(42,29,20,.08)}
.btn-action:active{transform:translateY(0)}
.btn-action.primary{animation:none}
.btn-action svg{width:14px;height:14px;flex-shrink:0}

.chip{transition:background .15s,border-color .15s,transform .15s}
.chip:hover{transform:translateY(-1px)}
.viewtoggle button{transition:background .2s,color .2s}

.personcard{
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  animation:fadeUp .4s ease both;
}
.personcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(42,29,20,.1)}
.dutyitem{
  transition:transform .15s ease,box-shadow .15s ease,background .15s;
  animation:fadeUp .35s ease both;
}
.dutyitem:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(42,29,20,.06)}
.dutyitem .av{transition:transform .2s}
.dutyitem:hover .av{transform:scale(1.06)}

.overlay{transition:opacity .22s ease,backdrop-filter .22s}
.overlay.show{backdrop-filter:blur(4px)}
.modal{animation:pop .28s cubic-bezier(.2,.9,.3,1)}
.shift-list button{transition:background .15s,padding-left .15s}
.shift-list button:hover{padding-left:18px}

.empty-state{animation:fadeUp .5s ease}
.empty-state .icon-wrap{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(145deg,var(--gold-pale),#fff);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  animation:floaty 3s ease-in-out infinite;
}
.empty-state .icon-wrap svg{width:28px;height:28px;color:var(--gold-deep)}

.banner{animation:fadeIn .35s ease;transition:background .2s,border-color .2s}
.header-auth .btn-action.primary{box-shadow:0 2px 0 rgba(161,24,34,.2)}
.header-auth .btn-action.primary:hover{animation:pulseSoft 1.2s ease infinite}

.rg-cell.rg-day{transition:box-shadow .15s,background .15s}
.loading-shimmer{
  background:linear-gradient(90deg,var(--sun) 25%,#fff 50%,var(--sun) 75%);
  background-size:200% 100%;
  animation:shimmer 1.2s linear infinite;
  border-radius:10px;height:12px;margin:8px 0;
}

.depttag{transition:transform .15s}
.personcard:hover .depttag{transform:scale(1.04)}
.legend{animation:fadeIn .4s .1s ease both}
.controls{animation:fadeIn .35s ease}

.ico{display:inline-flex;vertical-align:middle}


.sun-field{position:relative;overflow:hidden}
.sun-rays{
  position:absolute;top:-140px;right:-140px;
  width:420px;height:420px;pointer-events:none;opacity:.5;
  animation:spinSun 90s linear infinite;z-index:0;
}
@keyframes spinSun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sun-rays{animation:none}}
.sun-field > header{position:relative;z-index:2}

const GH = {

  rawBase: 'https://raw.githubusercontent.com/dispatchpqc/crewlist-dsp-asst/main'
};
const TOKEN_KEY = 'sunpq_gh_token';

/* ========== AUTH ========== */
const AUTH_ACCOUNTS = {
  admin:  { password: 'admin',  role: 'admin' },
  admin1: { password: 'admin1', role: 'admin1' },
  lich:   { password: 'lich',   role: 'lich' }
};
const AUTH_KEY = 'sunpq_sched_auth';
function getAuth(){
  try{
    const raw = sessionStorage.getItem(AUTH_KEY) || localStorage.getItem(AUTH_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.username || !AUTH_ACCOUNTS[o.username]) return null;

let _dynDeptColorIdx = 0;
function slugifyDept(label){
  const s = String(label||'').trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/Đ/g,'D').replace(/đ/g,'d')
    .replace(/[^A-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'').replace(/_+/g,'_');
  return s || 'OTHER';
}
/** Đăng ký vị trí trực mới nếu chưa có trong DEPTS */
function ensureDept(label){
  const raw = String(label||'').trim();
  if(!raw) return null;
  const low = raw.toLowerCase();
  if(DEPT_FROM_LABEL[low]) return DEPT_FROM_LABEL[low];
  for(const [k,d] of Object.entries(DEPTS)){
    if(String(d.name).toLowerCase()===low){
      DEPT_FROM_LABEL[low]=k;
      return k;
    }
  }
  let code = slugifyDept(raw);
  if(DEPTS[code]){
    let n=2;
    while(DEPTS[code+'_'+n]) n++;
    code = code+'_'+n;
  }
  const pal = DYNAMIC_DEPT_PALETTE[_dynDeptColorIdx % DYNAMIC_DEPT_PALETTE.length];
  _dynDeptColorIdx++;
  DEPTS[code] = {name: raw, color: pal.color, bg: pal.bg, dynamic: true};
  DEPT_FROM_LABEL[low] = code;
  return code;
}

function buildDaysForMonth(year,month){
  const days=[]; const prev=month===1?{y:year-1,m:12}:{y:year,m:month-1};
  for(let d=26;d<=31;d++){ const dt=new Date(prev.y,prev.m-1,d); if(dt.getMonth()!==prev.m-1) break; days.push([d,['CN','T2','T3','T4','T5','T6','T7'][dt.getDay()],prev.m,prev.y]); }
  for(let d=1;d<=25;d++){ const dt=new Date(year,month-1,d); days.push([d,['CN','T2','T3','T4','T5','T6','T7'][dt.getDay()],month,year]); }
  return days;
}

function calcTotal(shifts){ let t=0; (shifts||[]).forEach(s=>{ if(!s) return; if(s==='NL'||s==='P') t+=8; else if(s==='C9') t+=9; else if(s==='HC'||s==='M'||s==='E') t+=8; }); return t; }
function applyNotes(list){ list.forEach(e=>{ e.counts=countShifts(e.shifts); if(e.total==null) e.total=calcTotal(e.shifts); const short=TARGET_HOURS-e.total; e.note=short>0?('thiếu '+short+'h'):''; }); }
function empKey(e){ return String(e.id||'').replace(/^0+/,'').trim()+'|'+String(e.name||'').trim().toLowerCase(); }

function parseRosterWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  // raw:true để giữ Date/number; vẫn stringify khi so khớp tiêu đề
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  if(!rows.length) throw new Error('File trống');

  /** Nhận diện ô tiêu đề cột ngày: 26 | 26/09 | Date | serial Excel */
  function isDayHeaderCell(v){
    if(v==null || v==='') return false;
    if(v instanceof Date && !isNaN(v.getTime())) return true;
    if(typeof v==='number' && v>0){
      // serial Excel ngày (~40000–60000) hoặc số ngày 1–31
      if(v>=1 && v<=31) return true;
      if(v>=30000 && v<=60000) return true;
      return false;
    }
    const s=String(v).trim();
    if(/^\d{1,2}$/.test(s)) return true;                     // "26"
    if(/^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(s)) return true; // "26/09" "26-09-2026"
    if(/^\d{1,2}\s*\/\s*\d{1,2}$/.test(s)) return true;
    return false;
  }
  function dayNumFromHeader(v){
    if(v instanceof Date && !isNaN(v.getTime())) return v.getDate();
    if(typeof v==='number'){
      if(v>=1 && v<=31) return Math.floor(v);
      // Excel serial → JS date (epoch 1899-12-30)
      const d=new Date(Math.round((v-25569)*86400*1000));
      return d.getUTCDate();
    }
    const s=String(v).trim();
    const m=s.match(/^(\d{1,2})/);
    return m ? parseInt(m[1],10) : 0;
  }

  let headerRow=-1;
  for(let i=0;i<Math.min(30,rows.length);i++){
    const r=rows[i];
    const labels=r.map(c=>String(c==null?'':c).trim());
    const hasName=labels.some(x=>/họ\s*tên|ho\s*ten/i.test(x));
    const hasMa=labels.some(x=>/mã|ma\s*nv|nhân\s*viên/i.test(x));
    const dayHits=r.filter(isDayHeaderCell).length;
    if(hasName && (dayHits>=3 || hasMa)){ headerRow=i; break; }
  }
  if(headerRow<0) throw new Error('Không tìm thấy dòng tiêu đề Họ tên / ngày. Hãy dùng nút «Mẫu Excel» để tải file đúng định dạng.');
  const headerRaw=rows[headerRow];
  const header=headerRaw.map(c=>String(c==null?'':c).trim());
  let nameCol=header.findIndex(h=>/họ\s*tên|ho\s*ten/i.test(h));
  let idCol=header.findIndex(h=>/mã|ma\s*nv/i.test(h));
  let posCol=header.findIndex(h=>/vị\s*trí|vi\s*tri/i.test(h));
  if(nameCol<0) nameCol=2; if(idCol<0) idCol=1; if(posCol<0) posCol=0;

  // Ưu tiên: cột ngày liên tiếp ngay SAU "Họ tên" (layout mẫu chuẩn)
  const dayCols=[];
  let start=nameCol+1;
  for(let c=start;c<headerRaw.length;c++){
    if(isDayHeaderCell(headerRaw[c])) dayCols.push(c);
    else if(dayCols.length) break; // đã bắt đầu dải ngày → dừng khi hết
  }
  // Fallback: quét toàn hàng theo regex số ngày
  if(dayCols.length<7){
    dayCols.length=0;
    for(let c=0;c<headerRaw.length;c++){
      if(isDayHeaderCell(headerRaw[c])) dayCols.push(c);
    }
  }
  // Template / file ngắn: cho phép ít hơn 15 cột ngày (pad sau)
  if(dayCols.length<7) throw new Error('Không đủ cột ngày (cần ≥7, hiện '+dayCols.length+'). Hãy dùng nút «Mẫu Excel» (không đổi dòng tiêu đề cột ngày).');

  let year=+document.getElementById('selYear').value;
  let month=+document.getElementById('selMonth').value;
  for(let i=0;i<headerRow;i++){
    const line=rows[i].map(c=>String(c||'')).join(' ');
    const m=line.match(/Tháng\s*(\d{1,2})\s*\/\s*(\d{4})/i);
    if(m){ month=+m[1]; year=+m[2]; }
    const th=line.match(/Công\s*kế\s*hoạch[^0-9]*(\d+)/i);
    if(th) PLAN_DAYS=+th[1];
  }
  for(let i=0;i<headerRow;i++){
    const r=rows[i];
    for(let j=0;j<r.length;j++){
      if(/Tháng\s*\d/i.test(String(r[j]||''))&&r[j+1]&&/^\d{3}$/.test(String(r[j+1]).trim()))
        TARGET_HOURS=+String(r[j+1]).trim();
    }
  }
  document.getElementById('selMonth').value=String(month);
  document.getElementById('selYear').value=String(year);
  if(typeof window.syncMonthYearUI==='function') window.syncMonthYearUI();
  DAYS=buildDaysForMonth(year,month);
  if(dayCols.length!==DAYS.length){
    const wdRow=rows[headerRow+1]||[];
    DAYS=dayCols.map(c=>{
      const d=dayNumFromHeader(headerRaw[c]);
      let mon=month, yr=year; if(d>=26){ mon=month===1?12:month-1; yr=month===1?year-1:year; }
      const wd=String(wdRow[c]==null?'':wdRow[c]).replace(/T\./g,'T').replace('C.Nhật','CN');
      return [d,wd||'?',mon,yr];
    });
  }
  recomputeSunHol();

  const list=[]; let currentDept='DM';
  const SHIFT_ONLY=/^(HC|M|E|C9|NL|P|SN|T|B|HC\+C9|OFF)$/i;
  const STOP_SECTION=/check\s*cơ\s*cấu|total\s*hdq|^ca\s*sáng|^ca\s*tối|^hành\s*chính|train+ing|^off$/i;
  for(let i=headerRow+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const pos=String(r[posCol]||'').trim();
    const idRaw=String(r[idCol]||'').replace(/\s+/g,'').trim();
    const name=String(r[nameCol]||'').trim();
    if(STOP_SECTION.test(pos)||STOP_SECTION.test(name)||STOP_SECTION.test(idRaw)) break;

    // Vị trí trực: known → map sẵn; vị trí mới (vd Briefing PQC) → tự đăng ký nhóm riêng
    // Hỗ trợ 2 dạng:
    //  1) Cột "Vị trí trực" có giá trị (cùng hàng NV hoặc hàng tiêu đề nhóm)
    //  2) Hàng chỉ có tên nhóm ở cột Họ tên / cột đầu, không có mã NV, không có ca
    if(pos){
      const mapped = ensureDept(pos);
      if(mapped) currentDept = mapped;
      // Hàng chỉ đổi nhóm (không có tên NV) → bỏ qua, không thêm employee
      if(!name || name.toLowerCase()===pos.toLowerCase()) continue;
    } else if(!idRaw && name && name.length>=2 && name.length<=40){
      // Có thể là hàng tiêu đề nhóm viết vào cột Họ tên (một số file Excel)
      const hasAnyShift = dayCols.some(c => normalizeShift(r[c]));
      if(!hasAnyShift && !/phạm|nguyễn|trần|lê|phan|huỳnh|võ|đặng|bùi|đỗ|hồ|ngô|dương|lý/i.test(name)){
        // Không giống tên người Việt phổ biến + không có ca → coi là tên nhóm
        const mapped = ensureDept(name);
        if(mapped){ currentDept = mapped; continue; }
      }
    }

    if(!name) continue;
    if(SHIFT_ONLY.test(name)) continue;
    if(/^từ\s/i.test(name)) continue;
    if(/total|tổng|check/i.test(name)) continue;
    if(/nhân viên|tổng ca/i.test(name)) continue;
    // Mã NV: 3–10 chữ số (cho phép leading zero); hoặc trống nếu có họ tên đầy đủ
    const idOk = !idRaw || /^0*\d{3,10}$/.test(idRaw);
    if(!idOk) continue;
    if(!name || name.length<2) continue;
    // Pad shifts đúng số ngày tháng đang xem
    let shifts=dayCols.map(c=>normalizeShift(r[c]));
    while(shifts.length < DAYS.length) shifts.push('');
    shifts = shifts.slice(0, DAYS.length);
    let total=null;
    for(let c=r.length-1;c>=0;c--){
      const v=String(r[c]||'').trim();
      if(/^\d{2,3}$/.test(v)&&+v>=80&&+v<=300){ total=+v; break; }
    }
    list.push({
      id:idRaw.replace(/^0+/,'')||idRaw,
      name, dept: currentDept || 'DM', shifts,
      total: total!=null?total:calcTotal(shifts),
      key:list.length
    });
  }
  if(!list.length) throw new Error('Không đọc được nhân viên nào');
  applyNotes(list);
  return {year, month, employees:list};
}

  const by={}; EMP.forEach(e=>{(by[e.dept]||=[]).push(e);});
  orderedDeptCodes(by).forEach(dk=>{
    (by[dk]||[]).forEach(e=>{
      const c=countShifts(e.shifts);
      const pos = (e.dept!==lastDept) ? (DEPTS[e.dept]?DEPTS[e.dept].name:e.dept) : '';
      lastDept=e.dept;
      const row=[pos, e.id, e.name, ...(e.shifts||[]).map(s=>s||''), c.HC||0, c.M||0, c.E||0, c.C9||0, c.NL||0, e.total||calcTotal(e.shifts)];
      aoa.push(row);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  return wb;
}

function arrayBufferToBase64(buf){
  const bytes=new Uint8Array(buf);
  let binary='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

async function listGithubDir(path){
  const url=`${GH.apiBase}/${path.replace(/^\/+/,'')}?ref=${GH.branch}`;
  const headers={'Accept':'application/vnd.github+json'};
  const tok=getToken(); if(tok) headers.Authorization='Bearer '+tok;
  const r=await fetch(url,{headers});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub API '+r.status);
  return r.json();
}

function monthFolder(year,month){
  return `data/${year}/${String(month).padStart(2,'0')}.${year}`;
}

function pickBestXlsx(files){
  const xlsx=files.filter(f=>f.type==='file'&&/\.xlsx?$/i.test(f.name||''));
  if(!xlsx.length) return null;
  const scored=xlsx.map(f=>{
    const n=f.name||''; let score=0;
    const rev=n.match(/REV\s*0*(\d+)/i);
    if(rev) score+=100+parseInt(rev[1],10);
    if(/final/i.test(n)) score+=20;
    if(/update/i.test(n)) score+=10;
    score+=Math.min(10,(f.size||0)/100000);
    return {f,score,n};
  }).sort((a,b)=>b.score-a.score||b.n.localeCompare(a.n));
  return scored[0].f;
}

async function loadFromGitHub(year, month){
  if(loading) return;
  loading=true;
  document.getElementById('btnLoadGh').disabled=true;
  const folder=monthFolder(year,month);
  setBanner('Đang tải <code>'+folder+'</code> …','');
  document.getElementById('loadStatus').textContent='Đang tải…';
  try{
    let files=await listGithubDir(folder);
    if(!files){
      const yearDir=await listGithubDir('data/'+year);
      const names=Array.isArray(yearDir)?yearDir.map(x=>x.name).join(', '):'(không có)';
      throw new Error('Không có thư mục '+folder+'. Folder năm '+year+': '+names);
    }
    if(!Array.isArray(files)) throw new Error('Không phải thư mục: '+folder);
    const best=pickBestXlsx(files);
    if(!best) throw new Error('Không có file .xlsx trong '+folder);
    const dlUrl=best.download_url||`${GH.rawBase}/${best.path}`;
    document.getElementById('loadStatus').textContent=best.name;
    const res=await fetch(dlUrl);
    if(!res.ok) throw new Error('Tải file HTTP '+res.status);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const parsed=parseRosterWorkbook(wb);
    EMP=parsed.employees.map((e,i)=>{ const sh=(e.shifts||[]).slice(0,DAYS.length); while(sh.length<DAYS.length) sh.push(''); return {...e, shifts:sh, key:i}; });
    currentGhFile={ path:best.path, sha:best.sha, name:best.name };
    setBanner('Đã tải <b>'+best.name+'</b> · <b>'+EMP.length+'</b> NV · Tháng '+String(parsed.month).padStart(2,'0')+'/'+parsed.year,'ok');

    setView('duty');
  }catch(err){
    console.error(err);
    EMP=[]; currentGhFile=null;
    DAYS=buildDaysForMonth(+year,+month); recomputeSunHol();
    const mm=String(month).padStart(2,'0');
    const msg = (err.message||'') + '';

    if(notFound){
      setBanner('Tháng <b>'+mm+'/'+year+'</b> chưa có lịch trên GitHub (chưa sắp xếp hoặc chưa upload).','');
    } else {
      setBanner('Không tải được: '+msg,'err');
    }
    document.getElementById('loadStatus').textContent='';
    renderAll();
  }finally{
    loading=false;
    document.getElementById('btnLoadGh').disabled=false;
  }
}

/** Gộp NV từ file mới vào EMP hiện tại */
function mergeEmployees(incoming){
  const map=new Map();
  EMP.forEach(e=>map.set(empKey(e), e));
  let added=0, updated=0;
  incoming.forEach(ne=>{
    const k=empKey(ne);
    if(map.has(k)){
      const old=map.get(k);
      old.shifts=ne.shifts;
      old.dept=ne.dept||old.dept;
      old.total=ne.total;
      old.counts=countShifts(old.shifts);
      updated++;
    }else{
      map.set(k, {...ne, key:map.size});
      added++;
    }
  });
  EMP=Array.from(map.values()).map((e,i)=>({...e,key:i}));
  applyNotes(EMP);
  return {added, updated, total:EMP.length};
}

/** Ảnh chụp nhanh danh sách ca để so sánh trước/sau */
function snapshotEmp(list){
  return (list||[]).map(e=>({
    k: empKey(e),
    name: String(e.name||'').trim(),
    id: String(e.id||'').trim(),
    dept: e.dept||'',
    shifts: (e.shifts||[]).map(s=>s||'')
  })).sort((a,b)=>a.k.localeCompare(b.k));
}
function empSnapshotsEqual(a,b){
  if(!a||!b||a.length!==b.length) return false;
  for(let i=0;i<a.length;i++){
    if(a[i].k!==b[i].k) return false;
    if(a[i].dept!==b[i].dept) return false;
    const sa=a[i].shifts, sb=b[i].shifts;
    if(sa.length!==sb.length) return false;
    for(let j=0;j<sa.length;j++) if((sa[j]||'')!==(sb[j]||'')) return false;
  }
  return true;
}
function countShiftDiffs(before, after){
  const bm=new Map(before.map(x=>[x.k,x]));
  let changed=0, added=0;
  after.forEach(x=>{
    const p=bm.get(x.k);
    if(!p){ added++; return; }
    const sa=p.shifts||[], sb=x.shifts||[];
    const n=Math.max(sa.length,sb.length);
    for(let i=0;i<n;i++) if((sa[i]||'')!==(sb[i]||'')){ changed++; break; }
  });
  return {changed, added};
}

async function saveToGitHub(){
  if(!requireLogin('Đăng nhập để lưu lên GitHub.')) return;
  const tok=getToken();
  if(!tok){
    openTokenModal('Cần Personal Access Token (scope <b>repo</b>) để ghi file lên GitHub.');
    return;
  }
  if(!EMP.length){ setBanner('Chưa có dữ liệu để lưu.','err'); return; }
  const year=+document.getElementById('selYear').value;
  const month=+document.getElementById('selMonth').value;
  const folder=monthFolder(year,month);
  const mm=String(month).padStart(2,'0');
  const defaultName=`Lịch trực OCD on ${mm}-${year} web update.xlsx`;
  let path = currentGhFile && currentGhFile.path ? currentGhFile.path : `${folder}/${defaultName}`;
  let sha = currentGhFile && currentGhFile.sha ? currentGhFile.sha : null;

  document.getElementById('btnSaveGh').disabled=true;
  setBanner('Đang xuất Excel và đẩy lên GitHub…','');
  try{
    // refresh sha if file exists
    if(!sha){
      try{
        const meta=await fetch(`${GH.apiBase}/${path}?ref=${GH.branch}`,{
          headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok}
        });
        if(meta.ok){ const j=await meta.json(); sha=j.sha; path=j.path; }
      }catch(e){}
    } else {
      // always refresh sha to avoid conflict
      const meta=await fetch(`${GH.apiBase}/${path}?ref=${GH.branch}`,{
        headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok}
      });
      if(meta.ok){ const j=await meta.json(); sha=j.sha; }
      else if(meta.status===404) sha=null;
    }

    const wb=buildWorkbookFromEmp();
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const content=arrayBufferToBase64(out);

    const body={
      message: `Update roster ${mm}/${year} from web (${EMP.length} NV)`,
      content,
      branch: GH.branch
    };
    if(sha) body.sha=sha;

    const put=await fetch(`${GH.apiBase}/${path}`,{
      method:'PUT',
      headers:{
        'Accept':'application/vnd.github+json',
        'Authorization':'Bearer '+tok,
        'Content-Type':'application/json'
      },
      body: JSON.stringify(body)
    });
    if(!put.ok){
      const t=await put.text();
      throw new Error('GitHub PUT '+put.status+': '+t.slice(0,200));
    }
    const result=await put.json();
    currentGhFile={
      path: result.content.path,
      sha: result.content.sha,
      name: result.content.name
    };
    setBanner('Đã lưu lên GitHub: <b>'+currentGhFile.path+'</b> · '+EMP.length+' NV','ok');
  }catch(err){
    console.error(err);
    setBanner('Lưu GitHub thất bại: '+(err.message||err),'err');
  }finally{
    document.getElementById('btnSaveGh').disabled=false;
  }
}

  // Không phải tháng hiện tại → không tính đang trực / sắp vào ca (tránh nhầm ngày)
  if(!live){
    const mm=String(document.getElementById('selMonth').value).padStart(2,'0');
    const yy=document.getElementById('selYear').value;
    const nowMm=String(now.getMonth()+1).padStart(2,'0');
    const nowYy=now.getFullYear();
    dutyView.innerHTML=`<div class="dutywrap">
      <div class="dutysec anim-in" style="grid-column:1/-1">
        <h3>Trạng thái trực realtime</h3>
        <div class="dutyempty" style="padding:28px 16px;line-height:1.55">
          Đang xem lịch <b>tháng ${mm}/${yy}</b>.<br>
          Hôm nay là <b>${now.getDate()}/${nowMm}/${nowYy}</b> — mục <b>Đang trực / Sắp vào ca</b> chỉ hiển thị khi xem đúng tháng hiện tại.<br>
          Chuyển về tháng ${nowMm}/${nowYy} hoặc mở tab <b>Bảng đầy đủ</b> để xem lịch tháng ${mm}.
        </div>
      </div>
    </div>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px">* ${now.toLocaleString('vi-VN')} · Đăng nhập để sửa ca và lưu GitHub</p>`;
    return;
  }

  const onDuty = [], upcoming = [], off = [];

  // Ca tiếp theo để giao/nhận ca:
  // - Nếu sau 19:30 tối: Ca sắp tới chính là các ca sáng ngày hôm sau (todayIdx + 1)
  // - Nếu trước 07:30 sáng: Ca sắp tới chính là các ca sáng ngày hôm nay (todayIdx)
  const nextShiftIdx = (nowMin >= 19 * 60 + 30) ? todayIdx + 1 : todayIdx;
  const prevIdx = todayIdx - 1;

  list.forEach(e => {
    const sToday = todayIdx >= 0 ? (e.shifts[todayIdx] || '') : '';
    const sNext = (nextShiftIdx >= 0 && nextShiftIdx < DAYS.length) ? (e.shifts[nextShiftIdx] || '') : '';
    const sPrev = (prevIdx >= 0) ? (e.shifts[prevIdx] || '') : '';

    const initials = e.name.split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase().slice(0, 2) || '??';
    const d = DEPTS[e.dept] || { name: e.dept, color: '#888' };

    // 1. Kiểm tra ĐANG TRỰC (On Duty)
    // Ưu tiên ca đêm hôm trước còn kéo dài sang sáng hôm nay
    let isOnDuty = false;
    let onDutyShift = '';
    let onDutyLabel = '';
    let onDutyRemain = '';

    if (sPrev === 'E' && SHIFT_TIMES.E && nowMin < (SHIFT_TIMES.E.end[0] * 60 + SHIFT_TIMES.E.end[1])) {
      // Đang trong ca đêm từ ngày hôm trước (còn đến 07:30 sáng nay)
      isOnDuty = true;
      onDutyShift = 'E';
      onDutyLabel = SHIFT_TIMES.E.label;
      onDutyRemain = remainingText(SHIFT_TIMES.E.end[0], SHIFT_TIMES.E.end[1], true);
    } else if (sToday && SHIFT_TIMES[sToday]) {
      const t = SHIFT_TIMES[sToday];
      const startM = t.start[0] * 60 + t.start[1];
      const endM = t.end[0] * 60 + t.end[1];

      if (t.nextDay) {
        // Ca đêm (E) bắt đầu tối nay: 19:30 tối -> 07:30 sáng hôm sau
        isOnDuty = (nowMin >= startM || nowMin < endM);
      } else {
        // Ca ngày (HC, M, C9)
        isOnDuty = (nowMin >= startM && nowMin < endM);
      }

      if (isOnDuty) {
        onDutyShift = sToday;
        onDutyLabel = t.label;
        onDutyRemain = remainingText(t.end[0], t.end[1], !!t.nextDay);
      }
    }

    if (isOnDuty) {
      onDuty.push({
        e, initials, d, s: onDutyShift,
        remain: onDutyRemain,
        label: onDutyLabel
      });
      // KHÔNG return — vẫn kiểm tra ca sắp tới (vd: ca đêm + C9 sáng mai)
    }

    // 2. Kiểm tra SẮP VÀO CA (Upcoming)
    let addedUpcoming = false;
    // Sau 19:30 tối: chỉ lấy các ca ngày (HC, M, C9) ngày hôm sau, BỎ QUA ca đêm E ngày hôm sau
    if (nowMin >= 19 * 60 + 30) {
      if (sNext && SHIFT_TIMES[sNext] && !SHIFT_TIMES[sNext].nextDay) {
        upcoming.push({ e, initials, d, s: sNext, label: SHIFT_TIMES[sNext].label + ' · sáng mai' });
        addedUpcoming = true;
      }
    }
    // Trước 07:30 sáng: lấy các ca ngày (HC, M, C9) sáng hôm nay (nếu chưa đang trực ca đó)
    else if (nowMin < 7 * 60 + 30) {
      if (sToday && SHIFT_TIMES[sToday] && !SHIFT_TIMES[sToday].nextDay) {
        // Chỉ thêm upcoming nếu chưa đang trong ca đó
        if (!(isOnDuty && onDutyShift === sToday)) {
          upcoming.push({ e, initials, d, s: sToday, label: SHIFT_TIMES[sToday].label + ' · sáng nay' });
          addedUpcoming = true;
        }
      }
    }
    // Ban ngày (07:30 - 19:30): lấy các ca chưa tới giờ làm trong ngày
    else {
      if (sToday && SHIFT_TIMES[sToday]) {
        const t = SHIFT_TIMES[sToday];
        const startM = t.start[0] * 60 + t.start[1];
        if (nowMin < startM) {
          upcoming.push({ e, initials, d, s: sToday, label: t.label });
          addedUpcoming = true;
        }
      }
    }

    // 3. Còn lại xếp vào OFF (chỉ khi không đang trực và không sắp vào ca)
    if (!isOnDuty && !addedUpcoming) {
      off.push({ e, initials, d, s: sToday || 'OFF' });
    }
  });

  const item = (it, isOff) => `<div class="dutyitem"><div class="av" style="background:${it.d.color}">${it.initials}</div><div class="info"><div class="nm">${it.e.name}</div><div class="meta">${(it.d.name||'').replace('DSP ','')} · ${isOff ? 'Không ca hôm nay' : (it.label||'')}${it.remain ? ' · ' + it.remain : ''}</div></div><div class="tag ${it.s||'OFF'}">${it.s||'OFF'}</div></div>`;
  const icoOn = `<span style="display:inline-flex;width:10px;height:10px;border-radius:50%;background:#3CB371;box-shadow:0 0 0 3px rgba(60,179,113,.25);margin-right:2px"></span>`;
  const icoUp = `<span style="display:inline-flex;width:10px;height:10px;border-radius:50%;background:#F5A300;box-shadow:0 0 0 3px rgba(245,163,0,.25);margin-right:2px"></span>`;
  const icoOff = `<span style="display:inline-flex;width:10px;height:10px;border-radius:50%;background:#B0A090;margin-right:2px"></span>`;

  dutyView.innerHTML = `<div class="dutywrap">
    <div class="dutysec anim-in"><h3>${icoOn} Đang trực <span class="badge">${onDuty.length}</span></h3><div class="dutylist">${onDuty.length ? onDuty.map((it,i) => item(it,false).replace('class="dutyitem"', `class="dutyitem" style="animation-delay:${i*0.04}s"`)).join('') : '<div class="dutyempty">Không ai đang trực</div>'}</div></div>
    <div class="dutysec anim-in-d1"><h3>${icoUp} Sắp vào ca <span class="badge">${upcoming.length}</span></h3><div class="dutylist">${upcoming.length ? upcoming.map((it,i) => item(it,false).replace('class="dutyitem"', `class="dutyitem" style="animation-delay:${i*0.04}s"`)).join('') : '<div class="dutyempty">Không có ca sắp tới</div>'}</div></div>
    <div class="dutysec anim-in-d2" style="grid-column:1/-1"><h3>${icoOff} Off / nghỉ <span class="badge">${off.length}</span></h3><div class="dutylist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px">${off.length ? off.map((it,i) => item(it,true).replace('class="dutyitem"', `class="dutyitem" style="animation-delay:${Math.min(i,12)*0.03}s"`)).join('') : '—'}</div></div>
  </div>
  <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px">* ${new Date().toLocaleString('vi-VN')} · Đăng nhập để sửa ca và lưu GitHub</p>`;
}

(function initMonthYearDD(){
  const MONTHS=Array.from({length:12},(_,i)=>({v:String(i+1),t:String(i+1).padStart(2,'0')}));
  const YEARS=['2025','2026','2027'];
  const selM=document.getElementById('selMonth'), selY=document.getElementById('selYear');
  const lblM=document.getElementById('lblMonth'), lblY=document.getElementById('lblYear');
  const menuM=document.getElementById('menuMonth'), menuY=document.getElementById('menuYear');
  const ddM=document.getElementById('ddMonth'), ddY=document.getElementById('ddYear');
  const btnM=document.getElementById('btnMonth'), btnY=document.getElementById('btnYear');
  function syncLabels(){
    if(lblM) lblM.textContent=String(selM.value).padStart(2,'0');
    if(lblY) lblY.textContent=selY.value;
    if(menuM) menuM.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===String(selM.value)));
    if(menuY) menuY.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===String(selY.value)));
  }
  window.syncMonthYearUI=syncLabels;
  function buildMenu(menu,items,cur,onPick){
    menu.innerHTML=items.map(it=>{
      const a=String(it.v)===String(cur)?' active':'';
      return `<button type="button" role="option" data-v="${it.v}" class="${a}">${it.t}</button>`;
    }).join('');
    menu.onclick=e=>{ const b=e.target.closest('button[data-v]'); if(!b) return; onPick(b.dataset.v); };
  }
  function closeAll(){ [ddM,ddY].forEach(d=>{if(d)d.classList.remove('open')}); [btnM,btnY].forEach(b=>{if(b)b.setAttribute('aria-expanded','false')}); }
  function toggle(dd,btn){ const open=!dd.classList.contains('open'); closeAll(); if(open){ dd.classList.add('open'); btn.setAttribute('aria-expanded','true'); } }
  buildMenu(menuM,MONTHS,selM.value,v=>{ selM.value=v; syncLabels(); closeAll(); selM.dispatchEvent(new Event('change')); });
  buildMenu(menuY,YEARS.map(y=>({v:y,t:y})),selY.value,v=>{ selY.value=v; syncLabels(); closeAll(); selY.dispatchEvent(new Event('change')); });
  syncLabels();
  btnM.onclick=e=>{ e.stopPropagation(); toggle(ddM,btnM); };
  btnY.onclick=e=>{ e.stopPropagation(); toggle(ddY,btnY); };
  document.addEventListener('click',e=>{ if(!e.target.closest('.mp-dd')) closeAll(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
})();

/* Shift picker — dropdown trên ô lưới + giữ modal cho lịch cá nhân */
const overlay=document.getElementById('overlay'), modalBody=document.getElementById('modalBody');

function editCellShift(el, key, dayIdx){
  if(!requireLogin('Đăng nhập để chọn / sửa ca.')) return;
  if(el.classList.contains('editing')) return;
  const e=EMP.find(x=>x.key===key); if(!e) return;
  const cur = e.shifts[dayIdx] || '';
  el.classList.add('editing');
  const opts = SHIFT_PICK.map(s => {
    const sel = (s.code === cur) ? ' selected' : '';
    const label = s.code || '—';
    return `<option value="${s.code}"${sel}>${label}</option>`;
  }).join('');
  el.innerHTML = `<select class="shift-dd" size="1">${opts}</select>`;
  const sel = el.querySelector('select');
  sel.focus();
  // Mở dropdown ngay (một số trình duyệt hỗ trợ)
  try{ sel.showPicker && sel.showPicker(); }catch(ex){}
  let applied = false;
  const finish = (code) => {
    if(applied) return;
    applied = true;
    el.classList.remove('editing');
    if(code !== undefined && code !== cur){
      applyShift(key, dayIdx, code);
    } else {
      // Khôi phục text nếu không đổi
      el.textContent = cur || '';
      el.className = `rg-cell rg-day s-${cur||''} ${dayClass(dayIdx)}`;
    }
  };
  sel.onchange = () => finish(sel.value);
  sel.onblur = () => setTimeout(() => finish(undefined), 120); // delay để onchange kịp chạy
  sel.onkeydown = (ev) => {
    if(ev.key === 'Escape'){ finish(undefined); }
    if(ev.key === 'Enter'){ finish(sel.value); }
  };
}

  const short=TARGET_HOURS-e.total;
  e.note=short>0?('thiếu '+short+'h'):'';
  closeModal();
  renderAll();

document.getElementById('fileExcel').onchange=async ev=>{
  const file=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(!file) return;
  try{
    setBanner('Đang đọc & gộp <b>'+file.name+'</b>…','');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array', cellDates:true});
    const parsed=parseRosterWorkbook(wb);
    if(!parsed.employees || !parsed.employees.length){
      throw new Error('Không đọc được nhân viên nào. Dùng «Mẫu Excel» (đúng cột Họ tên / Mã / ngày).');
    }
    const beforeSnap = snapshotEmp(EMP);
    const {added, updated, total}=mergeEmployees(parsed.employees);
    const afterSnap = snapshotEmp(EMP);
    renderAll();

    // Trùng tên + trùng hết ca → bỏ qua, không upload GitHub
    if(empSnapshotsEqual(beforeSnap, afterSnap)){
      setBanner('File <b>'+file.name+'</b> trùng hoàn toàn với lịch đang có (tên + ca). <b>Không upload</b> lên GitHub.','');
      return;
    }
    const diff = countShiftDiffs(beforeSnap, afterSnap);
    // Có thay đổi ca hoặc tên mới → cập nhật file Excel tổng (từ EMP) và đẩy GitHub
    // (không upload nguyên file user nạp)
    setBanner(
      'Đã gộp <b>'+file.name+'</b>: +'+added+' NV mới, cập nhật ca '+updated
      +' · đổi ca '+diff.changed+' người, thêm '+diff.added
      +' · tổng <b>'+total+'</b> NV. Đang cập nhật file Excel tổng lên GitHub…','');
    try{
      await saveToGitHub();
    }catch(e){
      setBanner('Đã gộp trên web nhưng lưu GitHub lỗi: '+(e.message||e)+'. Bấm <b>Lưu GitHub</b> thủ công.','err');
    }
  }catch(err){ console.error(err); setBanner('Lỗi Excel: '+(err.message||err),'err'); }
};

/* INIT — mặc định tab Đang trực */

/* Theme */
const THEME_KEY='sunpq_theme';
function applyTheme(t){
  const mode = (t==='dark')?'dark':'light';
  document.documentElement.setAttribute('data-theme', mode==='dark'?'dark':'light');
  const sun=document.getElementById('iconSun'), moon=document.getElementById('iconMoon');
  if(sun) sun.style.display = mode==='dark'?'none':'';
  if(moon) moon.style.display = mode==='dark'?'':'none';
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark'?'light':'dark');
}
(function bootTheme(){
  let t='light';
  try{ t=localStorage.getItem(THEME_KEY)||'light'; }catch(e){}
  if(t!=='dark' && t!=='light'){
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t='dark';
  }
  applyTheme(t);
})();

document.getElementById('btnTheme').onclick=()=>toggleTheme();
document.getElementById('btnLogin').onclick=()=>openLoginModal();
document.getElementById('btnLogout').onclick=()=>{
  setAuth(null);
  refreshAuthUI();
  if(!EMP.length) renderAll();
  setBanner('Đã đăng xuất — chế độ chỉ xem.','');
};
(function init(){
  refreshAuthUI();
  setView('duty');
  const y=+document.getElementById('selYear').value;
  const m=+document.getElementById('selMonth').value;
  loadFromGitHub(y,m);
})();
</script>
