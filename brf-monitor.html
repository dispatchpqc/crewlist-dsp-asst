<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi Brief · SUN PhuQuoc</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141b23; --line:#232d38; --ink:#eef3f8; --muted:#8392a3;
    --gap:#6b7684; --soon:#f5a623; --now:#e30613; --past:#10b981;
    --red:#e30613; --gold:#f5a623;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100vh}

  /* ===== Thanh trên: logo, đồng hồ, trạng thái kết nối ===== */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 22px;border-bottom:1px solid var(--line);flex:none;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#161f29,#0f141a)}
  header::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(600px 80px at 20% 0%,rgba(245,166,35,.12),transparent 60%);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:.3px;position:relative;z-index:1}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(245,166,35,.6);
    animation:dotBreathe 2.4s ease-in-out infinite}
  @keyframes dotBreathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
  .brand .plane{display:inline-block;animation:planeFly 7s ease-in-out infinite}
  @keyframes planeFly{0%,100%{transform:translateX(0) rotate(90deg)}50%{transform:translateX(5px) rotate(90deg)}}
  .day-badge{position:relative;z-index:1;font-size:.72rem;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04);
    border:1px solid var(--line);padding:4px 10px;border-radius:999px;margin-left:10px}
  .clock{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:800}
  .clock small{display:block;font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.5px;text-align:center}
  .status{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
  .status .led{width:9px;height:9px;border-radius:50%;background:var(--gap)}
  .status.live .led{background:var(--past);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:ledPulse 2s infinite}
  .status.stale .led{background:var(--soon)}
  .status.dead .led{background:var(--now)}
  @keyframes ledPulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .toolbar{display:flex;gap:8px;align-items:center}
  .toolbar button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;font-size:.78rem;font-weight:700;cursor:pointer}
  .toolbar button.active{background:var(--gold);color:#241a03;border-color:transparent}
  .toolbar button:hover{filter:brightness(1.12)}

  /* ===== Lưới thẻ duty ===== */
  main{flex:1;overflow:auto;padding:20px;display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-content:start}
  .empty{grid-column:1/-1;margin:auto;text-align:center;color:var(--muted);padding:40px}
  .empty h2{color:var(--ink);font-size:1.3rem;margin-bottom:8px}
  .empty a{color:var(--gold)}

  .card{background:linear-gradient(165deg,#161f29,#111820);border:1px solid var(--line);border-radius:18px;padding:17px;
    position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:11px;
    animation:cardIn .35s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  main.grid-ready .card{animation-delay:calc(var(--i,0)*.05s)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:18px 0 0 18px}
  .card.lv-gap::before{background:var(--gap)}
  .card.lv-soon::before{background:linear-gradient(180deg,var(--soon),#c07a00)}
  .card.lv-now::before{background:linear-gradient(180deg,var(--now),#8e0309)}
  .card.lv-past::before{background:linear-gradient(180deg,var(--past),#06724f)}
  .card.lv-now{box-shadow:0 0 0 2px rgba(227,6,19,.55),0 10px 30px rgba(227,6,19,.18);animation:cardPulse 1.3s infinite, cardIn .35s cubic-bezier(.2,.9,.3,1) both}
  @keyframes cardPulse{0%,100%{box-shadow:0 0 0 2px rgba(227,6,19,.55),0 10px 30px rgba(227,6,19,.12)}50%{box-shadow:0 0 0 7px rgba(227,6,19,.14),0 10px 30px rgba(227,6,19,.22)}}
  @media (hover:hover){ .card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.35)} }

  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .duty-tag{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:.76rem;text-transform:uppercase;
    letter-spacing:.5px;padding:4px 10px;border-radius:999px;background:rgba(245,166,35,.14);color:var(--gold)}
  .card.lv-now .duty-tag{background:rgba(227,6,19,.18);color:#ff8a80}
  .card.lv-past .duty-tag{background:rgba(16,185,129,.16);color:#34d399}
  .cp-name{font-weight:800;font-size:1.02rem;margin-top:6px;display:flex;align-items:center;gap:6px}
  .cp-name::before{content:'👤';font-size:.85rem;opacity:.75}
  .cd{font-weight:900;font-variant-numeric:tabular-nums;font-size:1.7rem;line-height:1;text-align:right;
    display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .cd .ic{font-size:1.15rem}
  .cd small{display:block;font-size:.66rem;font-weight:700;color:var(--muted);text-align:right;margin-top:3px;letter-spacing:.3px}
  .cd.lv-soon{color:var(--soon)} .cd.lv-now{color:var(--now);text-shadow:0 0 16px rgba(227,6,19,.5)}
  .cd.lv-past{color:var(--past)} .cd.lv-gap{color:var(--ink)}

  /* ---- Thanh tiến trình đếm ngược tới giờ Brief ---- */
  .prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--now));
    transition:width 1s linear}
  .card.lv-past .prog i{background:var(--past)}

  /* ---- Hero: chuyến đầu tiên, nổi bật rõ ràng ---- */
  .hero{position:relative;border:1.5px solid rgba(245,166,35,.35);background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(245,166,35,.02));
    border-radius:13px;padding:11px 13px;overflow:hidden}
  .card.lv-now .hero{border-color:rgba(227,6,19,.5);background:linear-gradient(135deg,rgba(227,6,19,.14),rgba(227,6,19,.02))}
  .card.lv-past .hero{border-color:rgba(16,185,129,.35);background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02))}
  .hero-tag{position:absolute;top:0;right:0;background:var(--gold);color:#241a03;font-size:.6rem;font-weight:900;
    padding:3px 10px 3px 12px;border-radius:0 0 0 10px;letter-spacing:.4px}
  .card.lv-now .hero-tag{background:var(--now);color:#fff}
  .card.lv-past .hero-tag{background:var(--past);color:#06281c}
  .hero-flt{font-weight:900;font-size:1.08rem;margin-top:2px}
  .hero-route{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:.88rem;color:var(--ink)}
  .hero-route .ap{font-weight:800}
  .hero-route .arrow{color:var(--muted);display:flex;align-items:center;flex:1;min-width:24px}
  .hero-route .arrow .line{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 8px)}
  .hero-route .arrow .plane{margin:0 4px;transform:rotate(90deg);display:inline-block}
  .hero-std{font-size:.76rem;color:var(--muted);margin-top:3px}

  /* ---- Chặng tiếp theo: dạng dòng thời gian nối tiếp ---- */
  .next-label{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    margin:10px 0 2px;display:flex;align-items:center;gap:5px}
  .next-label::before,.next-label::after{content:'';flex:1;height:1px;background:var(--line)}
  .timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
  .timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:var(--line)}
  .tl-row{position:relative;padding:5px 0;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tl-row::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:7px;height:7px;
    border-radius:50%;background:var(--gap);border:2px solid var(--bg)}
  .flt-main{font-weight:700}
  .flt-route{color:var(--muted);font-weight:500;margin-left:6px}
  .pill{font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:4px;display:inline-flex;align-items:center;gap:2px}
  .pill.ok{background:rgba(16,185,129,.18);color:#34d399}
  .pill.missing{background:rgba(227,6,19,.18);color:#fca5a5}

  .actions{display:flex;gap:8px}
  .actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1b2430;color:var(--ink);
    font-weight:800;font-size:.82rem;cursor:pointer;transition:transform .15s,filter .15s,background .15s}
  .actions button.primary{background:linear-gradient(135deg,var(--red),#b3040f);border-color:transparent}
  .actions button:disabled{opacity:.4;cursor:default}
  .actions button:not(:disabled):hover{filter:brightness(1.18);transform:translateY(-1px)}
  .actions button:not(:disabled):active{transform:translateY(0) scale(.97)}
  .busy-msg{font-size:.72rem;color:var(--muted);min-height:14px}

  footer{flex:none;padding:7px 22px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line);
    display:flex;justify-content:space-between}

  @media (prefers-color-scheme: light){} /* luôn dùng nền tối — màn hình treo tường nên tối cho dễ nhìn ban đêm */

  .toolbar select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:.78rem;font-weight:700;cursor:pointer;max-width:170px}
  .card{cursor:zoom-in}
  .card .actions button{cursor:pointer}

  /* ---- Overlay phóng to 1 thẻ / chế độ tự xoay ---- */
  #zoomOv{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:4vw}
  #zoomOv.show{display:flex}
  #zoomOv .zcard{width:min(760px,92vw);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,.5)}
  #zoomOv .zcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;border-radius:22px 0 0 22px}
  #zoomOv .zcard.lv-gap::before{background:var(--gap)} #zoomOv .zcard.lv-soon::before{background:var(--soon)}
  #zoomOv .zcard.lv-now::before{background:var(--now)} #zoomOv .zcard.lv-past::before{background:var(--past)}
  #zoomOv .zclose{position:absolute;right:16px;top:14px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
  #zoomOv .zduty{font-size:1.3rem;font-weight:900;color:var(--gold)}
  #zoomOv .zcp{color:var(--muted);font-size:1rem;margin-top:4px}
  #zoomOv .zcd{font-size:3.2rem;font-weight:900;margin:14px 0 4px;font-variant-numeric:tabular-nums}
  #zoomOv .zcd small{display:block;font-size:.95rem;color:var(--muted);font-weight:700}
  #zoomOv .zflts{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:16px 0;margin:14px 0;
    display:flex;flex-direction:column;gap:10px;font-size:1.15rem}
  #zoomOv .zflt-row{display:flex;justify-content:space-between;align-items:center}
  #zoomOv .zflt-route{color:var(--muted);font-weight:500;margin-left:10px;font-size:1rem}
  #zoomOv .pill{font-size:.78rem;padding:3px 10px}
  #zoomOv .actions button{padding:14px;font-size:1rem}
  #zoomOv .auto-info{margin-top:10px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px}
  #zoomOv .auto-bar{flex:1;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
  #zoomOv .auto-bar i{display:block;height:100%;background:var(--gold);width:0%}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> SUN PhuQuoc · Theo dõi Brief <span class="plane">✈️</span><span class="day-badge" id="dayBadge">— duty</span></div>
  <div class="clock" id="clock">--:--:--<small id="clockDate">—</small></div>
  <div class="toolbar">
    <select id="cpFilter" title="Lọc theo CP"><option value="">Tất cả CP</option></select>
    <button id="rotateBtn" title="Tự xoay vòng từng thẻ khi có nhiều duty">🔄 Tự xoay: Tắt</button>
    <button id="soundBtn" title="Bật/tắt chuông nhắc">🔔 Chuông: Tắt</button>
    <div class="status dead" id="statusBox"><span class="led"></span><span id="statusText">Chưa nhận dữ liệu</span></div>
  </div>
</header>
<main id="grid"><div class="empty" id="emptyMsg"><h2>Đang chờ dữ liệu…</h2><p>Mở tab chính <b>index.html</b>, vào <b>Check PIB &amp; MET</b> và tải crewlist.<br>Tab đó sẽ tự gửi dữ liệu sang đây.</p></div></main>
<div id="zoomOv" onclick="if(event.target===this) closeZoom()">
  <div class="zcard" id="zcard"></div>
</div>
<footer><span>Tự cập nhật mỗi 10 giây · hiện toàn bộ duty còn lại trong ngày</span><span id="lastSync">—</span></footer>

<script>
/* ================================================================
 * TAB THEO DÕI BRIEF — độc lập, nhận dữ liệu từ tab chính (index.html)
 * qua BroadcastChannel + localStorage (đồng bộ giữa các tab cùng site).
 * In/Tải tài liệu gọi thẳng Print Bridge (9173) & SharePoint Bridge (8765)
 * trên máy, không cần tab chính đang mở lúc bấm in.
 * ================================================================ */
/* ---- Mọi biến trạng thái khai báo ở ĐẦU script: tránh lỗi "truy cập trước khi khởi tạo"
   khi loadFromStorage() gọi applyPayload()→render() ngay lập tức bằng dữ liệu cũ đã lưu ---- */
let latest=null, lastMsgAt=0, soundOn=false, chimed=new Set();
let lastDebug=null;
let cpFilterVal='';
let zoomDuty=null, zoomIsAuto=false;
let autoRotate=false, rotateTimer=null, rotateBarTimer=null, rotateIdx=0;
const ROTATE_MS=8000;

const LV_ICON={past:'✅',now:'🔴',soon:'⏰',gap:'🕐'};
const LV_TAG={past:'ĐÃ BRIEF',now:'BRIEF NGAY',soon:'SẮP BRIEF',gap:'CHUYẾN ĐẦU'};
const PRINT_BRIDGE='http://127.0.0.1:9173';
const SP_HOSTS=['http://127.0.0.1:8765','http://localhost:8765'];
const SP_SITE='https://sungroupcomvn.sharepoint.com/sites/SPQAirways/DailyOFP';

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtCd(ms){ const past=ms<0,a=Math.abs(ms); const h=Math.floor(a/36e5),m=Math.floor((a%36e5)/6e4);
  return (h>0?h+'h ':'')+m+'p'; }
function level(ms){ if(ms<=0) return 'past'; if(ms<=15*6e4) return 'now'; if(ms<=45*6e4) return 'soon'; return 'gap'; }
function beep(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
  o.frequency.value=880; g.gain.value=.08; o.start(); setTimeout(()=>{o.stop();ctx.close();},260);
}catch(e){} }

/* ---------- Nhận dữ liệu ---------- */
const ch = (typeof BroadcastChannel!=='undefined') ? new BroadcastChannel('sunpq-brf') : null;
if(ch) ch.onmessage = e=>applyPayload(e.data);
window.addEventListener('storage', e=>{
  if(e.key==='sunpq_brf_groups' && e.newValue){ try{ applyPayload(JSON.parse(e.newValue)); }catch(err){} }
});
function loadFromStorage(){ try{ const raw=localStorage.getItem('sunpq_brf_groups'); if(raw) applyPayload(JSON.parse(raw)); }catch(e){} }
function applyPayload(p){ if(!p||!p.groups) return; latest=p.groups; lastDebug=p.debug||null; lastMsgAt=p.ts||Date.now(); render(); }
loadFromStorage();
setInterval(loadFromStorage, 5000); // dự phòng nếu bỏ lỡ broadcast

/* ---------- Đồng hồ & trạng thái kết nối ---------- */
function tickClock(){
  const d=new Date();
  document.getElementById('clock').firstChild.textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clockDate').textContent = 'Giờ VN · '+d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'});
  const age=Date.now()-lastMsgAt, box=document.getElementById('statusBox'), txt=document.getElementById('statusText');
  box.className='status '+(!lastMsgAt?'dead':age<25000?'live':age<120000?'stale':'dead');
  txt.textContent = !lastMsgAt ? 'Chưa nhận dữ liệu' : age<25000 ? 'Đang nhận trực tiếp' : age<120000 ? 'Dữ liệu hơi cũ ('+Math.round(age/1000)+'s)' : 'Mất kết nối tab chính';
  document.getElementById('lastSync').textContent = lastMsgAt ? 'Cập nhật lúc '+new Date(lastMsgAt).toLocaleTimeString('vi-VN')+(lastDebug?(' · '+lastDebug.rawFlightsLen+' chuyến · '+lastDebug.chainsFound+' chuỗi · nguồn: '+(lastDebug.source||'?')):'') : '';
  if(latest) render(true); // chỉ cập nhật đếm ngược, không build lại DOM
}
setInterval(tickClock,1000); tickClock();

/* ---------- Vẽ danh sách ---------- */
function groupCpLabel(g){ const names=[...new Set(g.flights.map(f=>f.cp).filter(Boolean))]; return names.join(', '); }
function updateCpOptions(groups){
  const sel=document.getElementById('cpFilter');
  const seen=new Map(); groups.forEach(g=>g.flights.forEach(f=>{ if(f.cpId) seen.set(f.cpId, f.cp||f.cpId); }));
  const cur=sel.value;
  sel.innerHTML='<option value="">Tất cả CP</option>'+[...seen.entries()].sort((a,b)=>a[1].localeCompare(b[1]))
    .map(([id,name])=>`<option value="${esc(id)}">${esc(name)} (${esc(id)})</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur; else cpFilterVal='';
}
document.getElementById('cpFilter').onchange=e=>{ cpFilterVal=e.target.value; render(); };

function visibleGroups(){
  // Hiện TẤT CẢ duty còn lại trong ngày (không giới hạn 6 giờ nữa) — chỉ ẩn bớt
  // những duty đã qua giờ Brief quá lâu (hơn 2 giờ) để đỡ rối, còn bao nhiêu
  // sắp tới đều hiện đủ, dù cách xa giờ hiện tại bao nhiêu.
  if(!latest) return [];
  const now=Date.now();
  let v=latest.filter(g=>g.brfMs-now>-2*3600e3);
  if(cpFilterVal) v=v.filter(g=>g.flights.some(f=>f.cpId===cpFilterVal));
  return v.sort((a,b)=>a.brfMs-b.brfMs);
}
function progressPct(ms){
  // Thanh tiến trình: đầy dần trong 3 giờ trước giờ Brief, đầy 100% khi tới giờ/đã qua.
  const LOOKBACK=3*3600e3;
  if(ms<=0) return 100;
  const pct=100-Math.min(100,Math.max(0, ms/LOOKBACK*100));
  return Math.round(pct);
}
function cardInner(g, now, big){
  const ms=g.brfMs-now, lv=level(ms);
  const first=g.flights[0]||{};
  const rest=g.flights.slice(1);
  const restRows=rest.map((f,i)=>`<div class="tl-row"><span class="flt-main">FLT ${esc(f.flt)}<span class="flt-route">${esc(f.dep||'')}→${esc(f.arr||'')} · ${esc(f.localTime||'')}</span></span>
    <span><span class="pill ${f.ofp?'ok':'missing'}">OFP</span><span class="pill ${f.gd?'ok':'missing'}">GD</span></span></div>`).join('');
  const hasAny=g.flights.some(f=>f.ofp||f.gd);
  const brfStr=g.brfDisplay||'';
  const cpLabel=groupCpLabel(g);
  const pct=progressPct(ms);
  const heroBlock=`<div class="hero">
      <div class="hero-tag">${esc(LV_TAG[lv])}</div>
      <div class="hero-flt">✈ FLT ${esc(first.flt||'')} <span class="pill ${first.ofp?'ok':'missing'}">OFP</span><span class="pill ${first.gd?'ok':'missing'}">GD</span></div>
      <div class="hero-route"><span class="ap">${esc(first.dep||'')}</span><span class="arrow"><span class="line"></span><span class="plane">✈</span></span><span class="ap">${esc(first.arr||'')}</span></div>
      <div class="hero-std">STD ${esc(first.localTime||'')} · Brief lúc <b>${esc(brfStr)}</b></div>
    </div>`;
  const timelineBlock = rest.length ? `<div class="next-label">Chặng nối tiếp</div><div class="timeline">${restRows}</div>` : '';
  const progBlock = `<div class="prog"><i style="width:${pct}%"></i></div>`;
  if(big){
    return {lv, html:`<button class="zclose" onclick="closeZoom()">✕</button>
      <div class="zduty">Duty #${g.duty} · ${g.flights.length} chuyến</div>
      ${cpLabel?`<div class="zcp">${esc(cpLabel)}</div>`:''}
      <div class="zcd lv-${lv}"><span class="ic">${LV_ICON[lv]}</span>${ms<0?'Đã qua ':'Còn '}${fmtCd(ms)}<small>BRF ${esc(brfStr)} (giờ VN)</small></div>
      ${progBlock}
      ${heroBlock}
      ${timelineBlock}
      <div class="actions">
        <button class="primary" ${hasAny?'':'disabled'} onclick="doPrint(${g.duty},this)">🖨 In toàn bộ (${g.flights.length})</button>
        <button ${hasAny?'':'disabled'} onclick="doDownload(${g.duty},this)">⬇ Tải toàn bộ</button>
      </div>
      <div class="busy-msg" id="zmsg-${g.duty}"></div>
      <div class="auto-info" id="zauto" style="display:none"><span>Tự chuyển thẻ tiếp theo…</span><div class="auto-bar"><i id="zautoBar"></i></div></div>`};
  }
  return {lv, html:`<div class="row1"><div><div class="duty-tag">✈ Duty #${g.duty} · ${g.flights.length} chuyến</div>${cpLabel?`<div class="cp-name">${esc(cpLabel)}</div>`:''}</div>
      <div><div class="cd lv-${lv}"><span class="ic">${LV_ICON[lv]}</span>${ms<0?'Đã qua ':'Còn '}${fmtCd(ms)}<small>BRF ${esc(brfStr)}</small></div></div></div>
    ${progBlock}
    ${heroBlock}
    ${timelineBlock}
    <div class="actions">
      <button class="primary" ${hasAny?'':'disabled'} onclick="doPrint(${g.duty},this)">🖨 In toàn bộ (${g.flights.length})</button>
      <button ${hasAny?'':'disabled'} onclick="doDownload(${g.duty},this)">⬇ Tải toàn bộ</button>
    </div>
    <div class="busy-msg" id="msg-${g.duty}"></div>`};
}

function render(onlyCountdown){
  const grid=document.getElementById('grid');
  if(latest) updateCpOptions(latest);
  if(!latest || !latest.length){
    if(!onlyCountdown) grid.innerHTML=emptyStateHtml();
    return;
  }
  const now=Date.now();
  const visible=visibleGroups();
  if(!visible.length){
    if(!onlyCountdown) grid.innerHTML=emptyStateHtml();
    return;
  }
  // Tự chuyển sang chế độ xoay vòng khi có nhiều hơn 3 duty cùng lúc (nếu bật)
  if(autoRotate && visible.length>3 && !rotateTimer) startRotate();
  if(autoRotate && visible.length<=3 && rotateTimer){ stopRotate(); closeZoom(true); }
  if(zoomDuty){ const g=visible.find(x=>x.duty===zoomDuty); if(g) updateZoomContent(g,now); }
  if(onlyCountdown){
    visible.forEach(g=>{
      const el=document.getElementById('card-'+g.duty); if(!el) return;
      const {lv}=cardInner(g,now,false);
      el.className='card lv-'+lv;
      const cd=el.querySelector('.cd'); cd.className='cd lv-'+lv; cd.firstChild.textContent=(g.brfMs-now<0?'Đã qua ':'Còn ')+fmtCd(g.brfMs-now);
      if(lv==='now' && soundOn && !chimed.has(g.duty)){ chimed.add(g.duty); beep(); }
    });
    return;
  }
  chimed.clear();
  grid.innerHTML=visible.map(g=>{
    const {lv,html}=cardInner(g,now,false);
    return `<div class="card lv-${lv}" id="card-${g.duty}" onclick="if(!event.target.closest('button')) openZoom(${g.duty})">${html}</div>`;
  }).join('');
}

/* ---------- Nút chuông ---------- */
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent='🔔 Chuông: '+(soundOn?'Bật':'Tắt');
  document.getElementById('soundBtn').classList.toggle('active',soundOn);
  if(soundOn) beep(); // âm thử + "mở khóa" audio context theo yêu cầu trình duyệt
};

/* ---------- In / Tải — gọi thẳng bridge trên máy, độc lập với tab chính ---------- */
function groupOf(duty){ return (latest||[]).find(g=>g.duty===duty); }
async function spFetchBlob(flights, docTypes){
  let lastErr;
  for(const host of SP_HOSTS){
    try{
      const res=await fetch(host+'/sharepoint/download',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({siteUrl:SP_SITE, docTypes:docTypes||null, flights:flights.map(f=>({flt:f.flt,folderPath:f.folderPath,ngay:f.ngay}))})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob=await res.blob(); const cd=res.headers.get('Content-Disposition')||'';
      const m=cd.match(/filename="?([^"]+)"?/i); const ct=res.headers.get('Content-Type')||'';
      return { blob, fname:m?m[1]:((flights[0]?.flt||'file')+'_docs.pdf'), contentType:ct };
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('Không nối được SharePoint Bridge (8765)');
}
async function doPrint(duty, btn){
  const g=groupOf(duty); if(!g) return; const msg=document.getElementById('msg-'+duty);
  btn.disabled=true; const old=btn.textContent; btn.textContent='Đang gửi in…'; msg.textContent='';
  try{
    const st=await fetch(PRINT_BRIDGE+'/status').catch(()=>null);
    if(!st||!st.ok) throw new Error('Print Bridge (9173) chưa chạy trên máy này');
    const {blob,fname}=await spFetchBlob(g.flights,null);
    const file=new File([blob],fname,{type:'application/pdf'});
    const r=await fetch(PRINT_BRIDGE+'/print',{method:'POST',headers:{'Content-Type':'application/pdf','X-File-Name':fname,'X-File-Type':'OFP','X-Copies':'1'},body:await file.arrayBuffer()});
    const data=await r.json().catch(()=>({ok:false,log:'Phản hồi không hợp lệ'}));
    msg.textContent = data.ok ? '✅ Đã gửi in: '+fname : '⚠ Lỗi in: '+(data.log||'');
  }catch(e){ msg.textContent='⚠ '+(e.message||e); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
async function doDownload(duty, btn){
  const g=groupOf(duty); if(!g) return; const msg=document.getElementById('msg-'+duty);
  btn.disabled=true; const old=btn.textContent; btn.textContent='Đang tải…'; msg.textContent='';
  try{
    const {blob,fname}=await spFetchBlob(g.flights,null);
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000);
    msg.textContent='✅ Đã tải: '+fname;
  }catch(e){ msg.textContent='⚠ '+(e.message||e); }
  finally{ btn.disabled=false; btn.textContent=old; }
}


/* ---------- Chạm để phóng to 1 thẻ ---------- */
function openZoom(duty, fromAuto){
  const g=(visibleGroups()).find(x=>x.duty===duty); if(!g) return;
  zoomDuty=duty; zoomIsAuto=!!fromAuto;
  updateZoomContent(g, Date.now());
  document.getElementById('zoomOv').classList.add('show');
}
function updateZoomContent(g, now){
  const {lv,html}=cardInner(g, now, true);
  const card=document.getElementById('zcard');
  card.className='zcard lv-'+lv;
  card.innerHTML=html;
  const info=document.getElementById('zauto');
  if(info) info.style.display = zoomIsAuto ? 'flex' : 'none';
}
function closeZoom(silent){
  document.getElementById('zoomOv').classList.remove('show');
  const wasAuto=zoomIsAuto;
  zoomDuty=null; zoomIsAuto=false;
  if(wasAuto && !silent){ autoRotate=false; stopRotate(); updateRotateBtn(); }
}

/* ---------- Tự xoay vòng từng thẻ khi có nhiều duty ---------- */
function updateRotateBtn(){
  const b=document.getElementById('rotateBtn');
  b.textContent='🔄 Tự xoay: '+(autoRotate?'Bật':'Tắt');
  b.classList.toggle('active',autoRotate);
}
function startRotate(){
  stopRotate();
  rotateIdx=0;
  const step=()=>{
    const vis=visibleGroups();
    if(!vis.length){ stopRotate(); closeZoom(true); return; }
    const g=vis[rotateIdx % vis.length]; rotateIdx++;
    openZoom(g.duty, true);
    let p=0; const bar=document.getElementById('zautoBar');
    clearInterval(rotateBarTimer);
    rotateBarTimer=setInterval(()=>{ p+=100; if(bar) bar.style.width=Math.min(100,p/ROTATE_MS*100)+'%'; },100);
  };
  step();
  rotateTimer=setInterval(step, ROTATE_MS);
}
function stopRotate(){ clearInterval(rotateTimer); clearInterval(rotateBarTimer); rotateTimer=null; rotateBarTimer=null; }
document.getElementById('rotateBtn').onclick=()=>{
  autoRotate=!autoRotate; updateRotateBtn();
  if(autoRotate){ const vis=visibleGroups(); if(vis.length>1) startRotate(); else openZoom(vis[0]?.duty); }
  else { stopRotate(); closeZoom(true); }
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeZoom(); });

</script>
